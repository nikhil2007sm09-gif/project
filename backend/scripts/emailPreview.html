
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Templates Preview</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      padding: 20px;
      margin: 0;
    }
    .preview-container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 40px;
    }
    .template-section {
      margin-bottom: 60px;
    }
    .template-title {
      background: #667eea;
      color: white;
      padding: 15px 20px;
      border-radius: 8px 8px 0 0;
      font-size: 18px;
      font-weight: bold;
    }
    .template-preview {
      background: white;
      padding: 20px;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    iframe {
      width: 100%;
      height: 800px;
      border: none;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="preview-container">
    <h1>📧 Email Templates Preview</h1>
    
    <div class="template-section">
      <div class="template-title">
        1. Vendor Registration Email (Welcome Email)
      </div>
      <div class="template-preview">
        <iframe id="registration-template"></iframe>
      </div>
    </div>
    
    <div class="template-section">
      <div class="template-title">
        2. Vendor Approval Email (Congratulations Email)
      </div>
      <div class="template-preview">
        <iframe id="approval-template"></iframe>
      </div>
    </div>
  </div>

            max-width: 600px;

            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
          }

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;

            font-size: 28px;

          }

            padding-left: 20px;
          }
          .next-steps li {
            margin: 8px 0;
          }
          .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #666;
            font-size: 14px;

            height: 1px;

            <div class="next-steps">

              <ol>
                <li><strong>Admin Review:</strong> Our team will review your vendor application within 24-48 hours.</li>
                <li><strong>Approval Notification:</strong> You'll receive an email once your account is approved.</li>
                <li><strong>Start Selling:</strong> After approval, you can login and start adding your products!</li>
              </ol>
            </div>
            
            <div class="divider"></div>

            <ul>
              <li>✅ Add unlimited products to your store</li>

              <li>✅ Manage inventory and pricing</li>
              <li>✅ Track your sales and orders</li>
              <li>✅ Access vendor dashboard with analytics</li>
            </ul>
            
            <div class="divider"></div>

            <ul>
              <li>Use high-quality product images</li>
              <li>Write detailed product descriptions</li>
              <li>Keep your inventory updated</li>
              <li>Respond quickly to customer inquiries</li>
              <li>Offer competitive pricing</li>
            </ul>
            
            <p style="margin-top: 30px;">If you have any questions, feel free to contact our support team.</p>
            
            <p style="margin-top: 20px;">
              <strong>Best regards,</strong><br>

            color: #333;
            margin: 0;
            padding: 0;

            max-width: 600px;
            margin: 20px auto;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);

            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;

            margin: 0;
            font-size: 28px;
            font-weight: bold;

            padding: 40px 30px;

          .success-icon {
            text-align: center;
            font-size: 60px;
            margin: 20px 0;

            display: inline-block;
            background: #11998e;
            color: white;
            padding: 15px 40px;
            text-decoration: none;
            border-radius: 5px;
            margin: 20px 0;
            font-weight: bold;
            text-align: center;
          }
          .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #666;
            font-size: 14px;
          }
        </style>
      </head>

        <div class="container">
          <div class="header">
            <h1>🎊 Congratulations!</h1>
            <p style="margin: 10px 0 0 0; font-size: 16px;">Your Vendor Account is Approved</p>
          </div>
          
          <div class="content">
            <div class="success-icon">✅</div>

            <ol>

              <li>Add your first product</li>
              <li>Upload product images</li>
              <li>Set competitive prices</li>
              <li>Start receiving orders!</li>
            </ol>
            
            <p style="margin-top: 30px;">
              <strong>Best regards,</strong><br>
              The ClothesShop Team
            </p>

          <div class="footer">
            <p>© ${new Date().getFullYear()} ClothesShop. All rights reserved.</p>
          </div>
        </div>

    // Load templates into iframes
    document.getElementById('registration-template').srcdoc = registrationTemplate;
    document.getElementById('approval-template').srcdoc = approvalTemplate;
  </script>
</body>
</html>
